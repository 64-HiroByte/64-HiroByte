<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">64-HiroByte — Environmental Domain × Web Development</title>
  <desc id="desc">A flat dark header with Environmental Domain × Web Development as the main title. The pattern contains separate structures of benzene, phenol, trichloroethylene, tetrachloroethylene and formaldehyde H2C=O. No reaction is depicted.</desc>
  <defs>
    <clipPath id="header-clip"><rect width="1200" height="300" rx="16"/></clipPath>
    <g id="benzene" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -54L46.765 -27V27L0 54L-46.765 27V-27Z"/>
      <path d="M5.5 -42L34 -25.5M34 25.5L5.5 42M-34 20V-20"/>
    </g>
    <g id="phenol" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <use href="#benzene"/>
      <path d="M0 -54V-78" fill="none"/>
      <text x="0" y="-87" fill="currentColor" stroke="none" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">OH</text>
    </g>
    <g id="ethylene-bonds" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M-11 -3H11M-11 3H11M-32 -12L-50 -32M-32 12L-50 32M32 -12L50 -32M32 12L50 32"/>
    </g>
    <g id="ethylene-atoms" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="-24" y="7">C</text><text x="24" y="7">C</text>
      <text x="-62" y="-40">Cl</text><text x="62" y="-40">Cl</text><text x="62" y="54">Cl</text>
    </g>
    <g id="trichloroethylene">
      <use href="#ethylene-bonds"/><use href="#ethylene-atoms"/>
      <text x="-62" y="54" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">H</text>
    </g>
    <g id="tetrachloroethylene">
      <use href="#ethylene-bonds"/><use href="#ethylene-atoms"/>
      <text x="-62" y="54" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Cl</text>
    </g>
  <g id="formaldehyde"><path d="M14 -3H34M14 3H34M-9 -12L-27 -32M-9 12L-27 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><text x="0" y="7" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">C</text><text x="48" y="7" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">O</text><text x="-40" y="-39" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">H</text><text x="-40" y="54" fill="currentColor" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">H</text></g></defs>
  <g clip-path="url(#header-clip)">
    <rect width="1200" height="300" fill="#171b25"/>
    <g color="#55637a">
      <use href="#benzene" transform="translate(805 -8) rotate(12) scale(.64)"/>
      <use href="#trichloroethylene" transform="translate(1045 -12) rotate(-13) scale(.66)"/>
      <use href="#tetrachloroethylene" transform="translate(1203 20) rotate(12) scale(.72)"/>
      <use href="#phenol" transform="translate(826 164) rotate(-12) scale(.74)"/>
      <use href="#trichloroethylene" transform="translate(1036 161) rotate(8) scale(.86)"/>
      <use href="#phenol" transform="translate(1200 186) rotate(16) scale(.67)"/>
      <use href="#tetrachloroethylene" transform="translate(896 301) rotate(-10) scale(.72)"/>
      <use href="#benzene" transform="translate(1110 301) rotate(10) scale(.69)"/>
    <use href="#formaldehyde" transform="translate(924 77) rotate(-15) scale(.8)"/></g>
    <text x="55" y="56" fill="#8894a8" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" letter-spacing="1.8">64-HiroByte</text><text x="52" y="136" fill="#e2e7ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="500" letter-spacing="-.9">Environmental Domain</text><text x="52" y="202" fill="#e2e7ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="500" letter-spacing="-.9">× Web Development</text></g>
</svg>
